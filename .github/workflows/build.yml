name: Build WinSpace

on:
  push:
    branches: [main]
    paths-ignore:
      - WinSpace.exe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-winspace
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Publish
        run: dotnet publish WinSpace.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Copy exe to repository root
        run: Copy-Item publish/WinSpace.exe WinSpace.exe -Force

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WinSpace.exe
          if git diff --cached --quiet; then
            echo "WinSpace.exe unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update [$(date -u +%Y-%m-%d)]"
          git pull --rebase origin main
          git push origin HEAD:main
