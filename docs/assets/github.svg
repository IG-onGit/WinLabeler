    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3C7BFF" stop-opacity=".45"/><stop offset="1" stop-color="#3C7BFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B9BFF"/><stop offset="1" stop-color="#1F4DB8"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
